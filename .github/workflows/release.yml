name: Release

# Pushing a tag like v1.2.0 builds, tests and publishes a GitHub Release.
# Tags with a suffix (v1.2.0-beta.1) become pre-releases.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    env:
      APP: dist/Schichta.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ZIP=dist/Schichta-$VERSION-macOS.zip" >> "$GITHUB_ENV"
          echo "DMG=dist/Schichta-$VERSION.dmg" >> "$GITHUB_ENV"
          xcrun swiftc --version

      - name: Test web core and Git server
        run: |
          node --test core.test.cjs
          python3 -m unittest server_test.py

      - name: Import Developer ID certificate
        id: cert
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing certificate configured: building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          UNIVERSAL: "1"
        run: ./build-desktop.sh

      - name: Desktop self-test
        run: |
          lipo -archs "$APP/Contents/MacOS/Schichta"
          "$APP/Contents/MacOS/Schichta" --self-test

      - name: Notarize and staple
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Package
        run: |
          # ditto keeps the bundle's symlinks, permissions and signature intact (zip -r does not).
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          # Drag-to-install DMG: the app next to a link to /Applications.
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" && ditto "$APP" "$STAGE/Schichta.app" && ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Schichta $VERSION" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$DMG"

      - name: Sign, notarize and staple DMG
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Checksums
        run: |
          cd dist && shasum -a 256 "$(basename "$DMG")" "$(basename "$ZIP")" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.DMG }}
            ${{ env.ZIP }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$DMG" "$ZIP" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Schichta $VERSION" \
            --generate-notes --verify-tag $PRERELEASE

      - name: Clean up signing keychain
        if: always() && steps.cert.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
